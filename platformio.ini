; =============================================================================
; platformio.ini — Life Puck
;
; Target: Waveshare ESP32-S3-Touch-LCD-1.28-B
;         (ESP32-S3 + GC9A01 240x240 round LCD + CST816S touch + QMI8658C IMU)
;
; Why pioarduino, not the official platformio/espressif32?
;   This project uses LVGL 9.5, which needs Arduino-ESP32 3.x.
;   Espressif officially dropped PlatformIO support, so the official
;   platformio/espressif32 platform is stuck on Arduino-ESP32 2.x. The
;   pioarduino fork is the community-maintained drop-in that tracks the
;   current Arduino-ESP32 core (3.3.x, ESP-IDF 5.5.x as of this writing).
;
;   See: https://github.com/pioarduino/platform-espressif32
;
; Library strategy:
;   * LVGL, TFT_eSPI, and CST816S are pulled from the PlatformIO registry
;     by `lib_deps` — no vendored copies in the repo.
;   * TFT_eSPI is configured by `build_flags` instead of a User_Setup.h,
;     using the `-D USER_SETUP_LOADED` switch the library exposes for
;     exactly this purpose. The defines below are the 1:1 PIO translation
;     of the Arduino-IDE User_Setup.h that was previously living in
;     libraries/TFT_eSPI/User_Setup.h.
;   * LVGL finds the project's lv_conf.h via `-D LV_CONF_INCLUDE_SIMPLE`
;     plus `-I src` — the canonical PIO recipe. lv_conf.h lives at
;     src/lv_conf.h; do not move it without updating the include flag.
; =============================================================================

[platformio]
; This is just for show in the IDE sidebar; it doesn't affect the build.
default_envs = life_puck

; =============================================================================
; Common settings inherited by all environments below.
; =============================================================================
[env]
; Pioarduino "stable" channel — currently Arduino-ESP32 3.3.x / ESP-IDF 5.5.x.
; Pin to a specific release tag (e.g. .../download/55.03.37/...) once your
; build is happy if you want reproducibility. Until then, `stable` will
; automatically pick up bug-fix releases.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Generic ESP32-S3 dev kit board profile. Works for the Waveshare 1.28-B,
; which is a plain ESP32-S3-WROOM module. If your specific board has 8MB
; flash or octal PSRAM, see the commented options at the bottom of this file.
board = esp32-s3-devkitc-1

monitor_speed = 115200
upload_speed  = 921600

; Pin Arduino-ESP32 native USB-CDC on/off here. The Waveshare board exposes
; its serial console over the on-board USB-Serial bridge, not native USB,
; so we leave native USB-CDC off and use the UART0 path.
build_flags =
    ; ---- TFT_eSPI configuration (replaces libraries/TFT_eSPI/User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=12
    -D TFT_MOSI=11
    -D TFT_SCLK=10
    -D TFT_CS=9
    -D TFT_DC=8
    -D TFT_RST=14
    -D TFT_BL=2
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    ; ---- LVGL configuration ----
    ; Tell LVGL to pull lv_conf.h from the simple include path (src/).
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    ; ---- Project knobs (mirrors of Config.h compile-time switches) ----
    ; Set to 0 to compile out the cinematic intro entirely.
    -D ENABLE_STARTUP_INTRO=1
    ; ---- Quality of life ----
    ; Verbose-ish core log to Serial. Set to 0 in field builds.
    -D CORE_DEBUG_LEVEL=1

; Libraries are pulled from the PlatformIO registry. Pins are conservative —
; tighten to exact versions before tagging a release if you want byte-for-byte
; reproducible builds.
lib_deps =
    lvgl/lvgl @ ^9.5.0
    bodmer/TFT_eSPI @ ^2.5.43
    fbiego/CST816S @ ^1.3.0

; Default 1.2 MB app slot leaves plenty of headroom for now. If the binary
; ever grows past ~1 MB, switch to a custom partition table; see the bottom
; of this file for an example.
; board_build.partitions = default.csv

; =============================================================================
; Main build target.
; =============================================================================
[env:life_puck]
; Inherits everything from [env]. Add target-specific overrides here if needed.

; =============================================================================
; Optional: 8 MB flash + 2 MB PSRAM variant.
;
; The Waveshare 1.28-B comes in revisions with different flash/PSRAM sizes.
; If `pio run` reports "section will not fit" or you want to enable PSRAM,
; uncomment one of the blocks below and switch your default_envs to it.
; =============================================================================
; [env:life_puck_8mb_psram]
; extends = env:life_puck
; board_upload.flash_size = 8MB
; board_build.partitions  = default_8MB.csv
; build_flags =
;     ${env.build_flags}
;     -D BOARD_HAS_PSRAM
;     -D CONFIG_SPIRAM_USE_MALLOC
